<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bistro Demo AR - Menú Digital</title>
    <link rel="stylesheet" href="./style.css">
    
    <!-- Fuentes modernas de Google (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Model Viewer para la Realidad Aumentada -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
</head>
<body>
    <!-- Banner informativo para usuarios de escritorio -->
    <div id="desktop-warning" class="desktop-warning hidden">
        <p>📱 Abre este enlace desde tu celular para probar la Realidad Aumentada</p>
    </div>

    <header>
        <div class="header-content">
            <h1>Bistro Demo AR</h1>
        </div>
        <nav class="categories">
            <button class="active">Destacados</button>
            <button>Principales</button>
            <button>Bebidas</button>
            <button>Postres</button>
        </nav>
    </header>

    <main id="menu-container">
        <!-- Las tarjetas de los platos se generarán dinámicamente mediante script.js -->
    </main>

    <!-- Modal para el visor 3D/AR -->
    <div id="ar-modal" class="modal hidden">
        <div class="modal-content">
            <button id="close-modal" class="close-btn" aria-label="Cerrar visor AR">&times;</button>
            
            <!-- 
              Configuración óptima de model-viewer para máxima inmersión:
              ar-modes: Prioriza WebXR para una experiencia directa y limpia en Android.
              environment-image="neutral": Balancea la luz y evita colores quemados o raros.
              shadow-intensity y shadow-softness: Generan una sombra realista que ancla el modelo al piso/mesa.
              ar-scale="auto": Mantiene proporciones naturales o se auto-escala según convenga.
            -->
            <model-viewer 
                id="ar-viewer"
                src="https://modelviewer.dev/shared-assets/models/Astronaut.glb" 
                ios-src="https://modelviewer.dev/shared-assets/models/Astronaut.usdz"
                poster=""
                alt="Modelo 3D del platillo seleccionado"
                ar
                ar-modes="webxr scene-viewer quick-look"
                ar-scale="fixed"
                ar-placement="floor"
                camera-controls
                touch-action="pan-y"
                auto-rotate
                environment-image="neutral"
                shadow-intensity="1"
                shadow-softness="0.8"
                exposure="1.1"
                interaction-prompt="none">
                
                <button slot="ar-button" id="ar-button" class="btn-ar-slot" style="display: none;">
                    🍽️ Ver en tu mesa
                </button>
                
                <div id="ar-prompt">
                    <img src="https://modelviewer.dev/shared-assets/icons/hand.png" alt="Mueve el teléfono para posicionar">
                </div>
            </model-viewer>
        </div>
    </div>

    <script src="./script.js"></script>
</body>
</html>
