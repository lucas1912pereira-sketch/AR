<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bistro Demo AR - Menú Digital</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍽️</text></svg>">
    
    <!-- Fuentes modernas de Google (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Model Viewer para la Realidad Aumentada -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
</head>
<body>
    <!-- Banner informativo para usuarios de escritorio -->
    <div id="desktop-warning" class="desktop-warning hidden">
        <p>📱 Abre este enlace desde tu celular para probar la Realidad Aumentada en tu mesa</p>
    </div>

    <header>
        <div class="header-content">
            <h1>Bistro Demo AR</h1>
        </div>
        <nav class="categories">
            <button class="active">Destacados</button>
            <button>Principales</button>
            <button>Bebidas</button>
            <button>Postres</button>
        </nav>
    </header>

    <main id="menu-container">
        <!-- Las tarjetas de los platos se generarán dinámicamente mediante script.js -->
    </main>

    <!-- Modal 3D Interactivo para inspección previa a la AR -->
    <div id="modal-visor-3d" class="modal-3d hidden">
        <div class="modal-3d-content">
            <!-- Botón Cerrar -->
            <button id="close-modal-3d" class="close-3d-btn" aria-label="Cerrar visor 3D">&times;</button>
            
            <!-- Encabezado del plato -->
            <div class="modal-3d-header">
                <h2 id="modal-3d-title">Nombre del Plato</h2>
                <span id="modal-3d-price">Gs. 0</span>
            </div>

            <!-- Contenedor del Visor 3D -->
            <div class="model-viewer-container">
                <!-- Loader visible mientras se descarga el modelo .glb -->
                <div id="model-loader" class="model-loader">
                    <div class="spinner"></div>
                    <p>Cargando modelo 3D...</p>
                </div>

                <!-- Configuración optimizada de model-viewer -->
                <model-viewer 
                    id="ar-viewer"
                    src="" 
                    alt="Modelo 3D del platillo seleccionado"
                    ar
                    ar-modes="webxr scene-viewer quick-look"
                    ar-scale="fixed"
                    camera-controls
                    disable-pan
                    camera-orbit="0deg 75deg 105%"
                    min-camera-orbit="auto 20deg auto"
                    max-camera-orbit="auto 88deg auto"
                    min-field-of-view="25deg"
                    max-field-of-view="45deg"
                    environment-image="neutral"
                    shadow-intensity="1"
                    shadow-softness="0.8"
                    exposure="1.1"
                    interaction-prompt="none">
                </model-viewer>
            </div>

            <!-- Acciones (AR y WhatsApp) -->
            <div class="modal-3d-actions">
                <button id="btn-activate-ar" class="btn-ar-primary">
                    ✨ Proyectar en tu mesa (AR)
                </button>
                <p class="ar-helper-text">Te pediremos permiso para usar tu cámara y colocar el plato en tu mesa real.</p>
                
                <button id="btn-modal-delivery" class="btn-delivery-secondary">
                    💬 Pedir este plato por WhatsApp
                </button>
            </div>
        </div>
    </div>

    <script src="./script.js"></script>
</body>
</html>
